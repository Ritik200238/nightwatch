name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[api,dev]"
      - run: ruff check nightwatch tests
      - run: python -m pytest -q -p no:warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The pure logic the page relies on (saved-copy handling, record wording, caveats, hours):
      # each file prints "ok" and exits non-zero on the first failed assertion.
      - run: for t in src/lib/*.test.mjs; do node --experimental-strip-types "$t"; done
      - run: npm run build
