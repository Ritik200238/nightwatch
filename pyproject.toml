[project]
name = "nightwatch"
version = "0.1.0"
description = "Decision stress tester for tokenized US stocks: find past moments like now, measure what followed, stress the position, size the decision."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
    "feedparser>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# The HTTP API and the language layer. Everything else (CLI, recorder, replay) runs without them.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=1.0",
]
# The test suite covers the API and the language layer, so the dev extra pulls them in:
# `pip install -e ".[dev]"` on its own used to leave two test modules unable to import.
dev = [
    "nightwatch[api]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
nightwatch = "nightwatch.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# E501: report/render lines are deliberately long f-strings. N803/N806: matrix maths uses
# X, Z, L. UP042: str-enums serialise to JSON as plain strings on purpose. B008: frozen
# policy dataclasses as defaults are immutable. N818: InsufficientData reads as a condition.
ignore = ["E501", "N803", "N806", "UP042", "B008", "N818"]
