# Nightwatch: API + always-on recorder + web desk, one shared data volume.
#
#   docker compose build
#   docker compose run --rm api nightwatch sync --core          # first time: backfill history (long)
#   docker compose run --rm api nightwatch replay --tickers TSLA NVDA --reset   # score past windows for the calibration page
#   docker compose run --rm api nightwatch calendars            # earnings + macro calendars
#   docker compose up -d
#
# Or copy an existing data/nightwatch.sqlite into the volume instead of backfilling
# (docs/deploy.md).

services:
  api:
    build: .
    image: nightwatch:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NIGHTWATCH_DATA_DIR: /data
      NIGHTWATCH_CORS: ${NIGHTWATCH_CORS:-*}
      # The language layer picks whichever of these has a key; with neither, the desk
      # answers from the rules and /health says so rather than claiming a model.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BITGET_QWEN_API_KEY: ${BITGET_QWEN_API_KEY:-}
      NIGHTWATCH_LLM_PROVIDER: ${NIGHTWATCH_LLM_PROVIDER:-auto}
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      - nightwatch-data:/data
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  recorder:
    image: nightwatch:latest
    restart: unless-stopped
    command: ["nightwatch", "record", "--interval", "60"]
    # The image's health check belongs to the API. A recorder is healthy when it is
    # still writing: the newest order-book snapshot must be less than five minutes old.
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3,sys,time; ts=sqlite3.connect('file:/data/nightwatch.sqlite?mode=ro',uri=True).execute('SELECT MAX(ts) FROM orderbook_snapshots').fetchone()[0] or 0; sys.exit(0 if time.time()*1000-ts < 300000 else 1)"]
      interval: 60s
      timeout: 20s
      start_period: 180s
      retries: 3
    environment:
      NIGHTWATCH_DATA_DIR: /data
      FRED_API_KEY: ${FRED_API_KEY:-}
    volumes:
      - nightwatch-data:/data
    logging: *logging
    depends_on:
      - api

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    logging: *logging
    depends_on:
      - api

volumes:
  nightwatch-data:
