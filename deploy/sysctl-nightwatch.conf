# Keep the API's working set in memory on a small box.
#
# Measured on the 1 GB Lightsail box: with the default swappiness of 60 the kernel moved
# 140 MB of the API's cached feature frames to swap while it sat idle, leaving 95 MB
# resident. The first narrowed search after that took 23 s paging them back in; the same
# search with the frames resident takes 3 s. Preferring to drop file cache over swapping
# out process memory keeps the frames where the warm-up put them.
vm.swappiness = 10
